# compose-lgtm-only.yaml
#
# Minimal observability stack: Grafana LGTM (all-in-one image bundling
# Grafana + Loki + Tempo + Mimir + Prometheus + OpenTelemetry Collector)
# plus an empty app slot for your service.
#
# Use this as the starting point when you don't need Postgres or Kafka.
#
# Adapt:
#   1. Change `app` service to match your project's image and service name
#   2. Update `OTEL_SERVICE_NAME` to match your service name
#   3. Adjust ports if 3000/4318/9090 conflict with anything else running
#
# Access URLs after `podman compose up -d`:
#   Grafana UI:    http://localhost:3000
#   OTLP HTTP:     http://localhost:4318  (used by apps for OTLP export)
#   Prometheus:    http://localhost:9090
#   Tempo (HTTP):  http://localhost:3200
#   Loki (HTTP):   http://localhost:3100

services:
  # ─── Observability backend (all-in-one) ─────────────────────────────────
  lgtm:
    image: docker.io/grafana/otel-lgtm:0.8.1
    container_name: lgtm
    ports:
      - "3000:3000"      # Grafana UI
      - "4317:4317"      # OTLP gRPC (rarely used; prefer 4318)
      - "4318:4318"      # OTLP HTTP — apps export here
      - "9090:9090"      # Prometheus / Mimir query
      - "3100:3100"      # Loki
      - "3200:3200"      # Tempo
    environment:
      # Anonymous access keeps the demo simple. Don't ship this to production.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      # Mount a custom Collector config if you have one; the image ships
      # with a working default if this file is absent.
      # The `:Z` flag is required on SELinux-enforcing distros (Fedora, RHEL).
      # It's a no-op on Ubuntu/Debian/macOS.
      - ./otelcol/config.yaml:/otel-lgtm/otelcol-config.yaml:Z
      # Optional: pre-provisioned datasources
      - ./grafana/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/datasources.yaml:Z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # ─── Application slot ───────────────────────────────────────────────────
  # Replace this entirely with your service definition.
  app:
    image: your-org/your-app:latest
    container_name: app
    depends_on:
      lgtm:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Standard OpenTelemetry environment variables — the OTel SDK and
      # auto-instrumentation agents all read these.
      - OTEL_SERVICE_NAME=your-app
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local,service.version=dev
      # Sample 100% of traces in dev; reduce in production
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=1.0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s   # Adjust based on actual cold-start time

networks:
  default:
    name: observability
