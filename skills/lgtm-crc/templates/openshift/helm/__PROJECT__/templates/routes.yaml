# Host access on OpenShift Local is through the router, never NodePorts,
# port-forward or tunnels: https://<route>-<namespace>.apps-crc.testing,
# edge TLS, plain HTTP redirected. capture-evidence.sh checks each Route's
# health-check-path with the cluster's ingress CA.
{{- range $name, $svc := .Values.services }}
{{- if and $svc.route (or (not $svc.ai) $.Values.ai.enabled) }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "chart.labels" $ | nindent 4 }}
  {{- if ne ($svc.probe | default "http") "tcp" }}
  annotations:
    health-check-path: {{ $svc.routeHealthPath | default "/q/health/ready" | quote }}
  {{- end }}
spec:
  to:
    kind: Service
    name: {{ $name }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- end }}
