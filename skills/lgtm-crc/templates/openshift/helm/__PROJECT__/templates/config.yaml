# Shared env contract. Only the ConfigMap lives in this file: the pod
# checksum hashes it, and must not hash the generated Secret (secret.yaml),
# which re-renders randomly under helm template (Argo CD).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-app-config
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  QUARKUS_PROFILE: "prod"
  JAVA_OPTS_APPEND: "-Duser.timezone=UTC"
  JAVA_MAX_MEM_RATIO: {{ .Values.javaMaxMemRatio | quote }}
  {{- if .Values.kafka.enabled }}
  KAFKA_BOOTSTRAP_SERVERS: "{{ .Values.kafka.cluster }}-kafka-bootstrap:9092"
  {{- end }}
  {{- if .Values.postgres.enabled }}
  QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://{{ .Release.Name }}-postgres-rw:5432/{{ .Values.postgres.database }}"
  {{- end }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
