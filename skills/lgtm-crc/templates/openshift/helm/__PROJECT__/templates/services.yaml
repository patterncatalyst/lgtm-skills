{{- range $name, $svc := .Values.services }}
{{- if or (not $svc.ai) $.Values.ai.enabled }}
{{- $native := and $.Values.native.enabled (eq $name $.Values.native.service) }}
{{- $scaled := and $.Values.keda.enabled $svc.keda }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "chart.labels" $ | nindent 4 }}
spec:
  {{- if not $scaled }}
  # Omitted when a ScaledObject owns the replica count, so Helm and the HPA
  # do not fight.
  replicas: 1
  {{- end }}
  # The selector never changes (it is immutable): turning the mesh on later
  # only adds pod labels. The v2 canary owns its pods via its own ReplicaSet.
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    {{- include "chart.podTemplate" (dict "root" $ "name" $name "svc" $svc "version" "v1" "native" $native) | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "chart.labels" $ | nindent 4 }}
spec:
  # Selects v1 and, with a canary, v2: the VirtualService does the split.
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    {{- with $svc.grpcPort }}
    - name: grpc
      port: {{ . }}
      targetPort: grpc
    {{- end }}
---
{{- end }}
{{- end }}
