{{- if .Values.mesh.enabled }}
# Namespace-wide mTLS: every meshed workload accepts only mesh traffic.
# Unmeshed pods (Kafka, Postgres, otel-lgtm) are untouched.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  mtls:
    mode: STRICT
{{- range $name, $svc := .Values.services }}
{{- if $svc.route }}
---
# The OpenShift router is not in the mesh, so the Route delivers plaintext
# to {{ $name }}. STRICT here would answer every Route request with a 502.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ $name }}-permissive
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  mtls:
    mode: PERMISSIVE
{{- end }}
{{- end }}
{{- if .Values.mesh.canary.enabled }}
{{- $cname := .Values.mesh.canary.service }}
{{- $csvc := index .Values.services $cname }}
---
# {{ $cname }} v2: the same image under a version: v2 label, so the
# weighted split below is observable per pod. Always JVM, so it also carries
# the Java agent when a native v1 does not.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $cname }}-v2
  labels:
    app.kubernetes.io/name: {{ $cname }}
    version: v2
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $cname }}
      version: v2
  template:
    {{- include "chart.podTemplate" (dict "root" . "name" $cname "svc" $csvc "version" "v2" "native" false) | nindent 4 }}
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ $cname }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  host: {{ $cname }}
  subsets:
    - name: v1
      labels: {version: v1}
    - name: v2
      labels: {version: v2}
---
# Mesh-internal split: applies to sidecar-to-sidecar calls. OSSM 3
# provisions no ingress gateway; the edge is the Route.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ $cname }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ $cname }}
  http:
    - route:
        - destination: {host: {{ $cname }}, subset: v1}
          weight: {{ sub 100 .Values.mesh.canary.v2Weight }}
        - destination: {host: {{ $cname }}, subset: v2}
          weight: {{ .Values.mesh.canary.v2Weight }}
{{- end }}
{{- end }}
