{{- if .Values.postgres.enabled }}
# Postgres credentials. The password is generated once at install and kept
# across upgrades via lookup; it is never written to values, files or
# evidence. Under Argo CD (helm template) lookup returns nothing, so the
# Application must ignoreDifferences on /data/password (install-gitops.sh).
{{- $secret := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgres-app" .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres-app
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.postgres.username | b64enc | quote }}
  {{- if $secret }}
  password: {{ index $secret.data "password" | quote }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
