# OpenShift Service Mesh 3 control plane (Sail operator). Istio is pinned to
# an exact release the installed OSSM offers (OSSM 3.4.3: v1.26 to v1.30).
# Never use a floating `vX.Y-latest`. List what the operator accepts with:
#   oc get crd istios.sailoperator.io -o json | jq -r '.. | .version? | .enum? // empty | .[]' | sort -uV
# The Istio CR named "default" serves revision "default": pods join with the
# pod-template label istio.io/rev=default (chart mesh.enabled).
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    app.kubernetes.io/part-of: __PROJECT__
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-cni
  labels:
    app.kubernetes.io/part-of: __PROJECT__
---
apiVersion: sailoperator.io/v1
kind: IstioCNI
metadata:
  name: default
spec:
  version: v1.30.5
  namespace: istio-cni
---
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
spec:
  version: v1.30.5
  namespace: istio-system
  updateStrategy:
    type: InPlace
