# Library mode pyproject.toml — local-only, pure-language Python (no containers,
# no services, no OTel). The Python sibling of lgtm-csharp / lgtm-cpp.
#
# Merge into pyproject.toml, or apply the dev deps with:
#   uv add --dev pytest pytest-mock ruff mypy
#
# Versions are a snapshot of stable releases; re-check upstream and promote to the
# latest stable before use (hold only for an actual incompatibility, with a reason).

[project]
name = "example-package"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_package"]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-mock==3.14.0",
    "ruff==0.14.0",
    "mypy==1.18.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No integration marker and no Testcontainers in library mode — unit tests only.

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_redundant_casts = true
files = ["src", "tests"]
