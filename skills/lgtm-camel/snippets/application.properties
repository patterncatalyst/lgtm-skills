# Camel context
camel.context.name=${quarkus.application.name}

# Kafka defaults
camel.component.kafka.brokers=localhost:9092
camel.component.kafka.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
camel.component.kafka.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
camel.component.kafka.key-serializer=org.apache.kafka.common.serialization.StringSerializer
camel.component.kafka.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Route-specific topics (override per environment)
route.input-topic=my-input
route.output-topic=my-output
route.dlq-topic=my-dlq
route.group-id=${camel.context.name}

# Camel Micrometer metrics (requires camel-quarkus-micrometer)
quarkus.camel.metrics.enable-route-policy=true
quarkus.camel.metrics.enable-message-history=false

# OpenTelemetry
quarkus.otel.exporter.otlp.endpoint=http://localhost:4318
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.service.name=${quarkus.application.name}
